<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>手机预览 · 咪了个喵</title>
<style>
  html,body{margin:0;height:100%;background:#2b2b2b;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif;overflow:hidden}
  .frame{position:relative;padding:14px;border-radius:44px;background:#111;box-shadow:0 20px 60px rgba(0,0,0,.6);transform-origin:center center}
  .screen{width:390px;height:844px;border-radius:32px;overflow:hidden;background:#fff;position:relative}
  iframe{width:100%;height:100%;border:0;display:block}
  .tip{position:fixed;left:12px;bottom:12px;color:#888;font-size:12px}
  .bar{position:fixed;top:8px;left:12px;display:flex;gap:6px}
  .bar button{background:#3a3a3a;color:#ddd;border:1px solid #555;border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer}
</style>
</head>
<body>
<div class="frame" id="frame"><div class="screen"><iframe id="ifr" src="../index.html"></iframe></div></div>
<div class="tip">iPhone 14 · 390 × 844 · <span id="zoom"></span></div>
<script>
  function fit(){
    var f = document.getElementById('frame');
    f.style.transform = 'scale(1)';
    var r = f.getBoundingClientRect();
    var s = Math.min(1, (innerHeight - 24)/r.height, (innerWidth - 24)/r.width);
    f.style.transform = 'scale(' + s + ')';
    document.getElementById('zoom').textContent = Math.round(s*100) + '%';
  }
  window.addEventListener('resize', fit);
  setTimeout(fit, 100);
  setTimeout(fit, 800);
</script>
</body>
</html>
