<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#fdf5ea">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="咪了个喵">
<meta name="format-detection" content="telephone=no">
<title>咪了个喵</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">

  <!-- 顶部 -->
  <header class="topbar">
    <button class="round-btn" id="btnSettings" aria-label="设置">
      <svg viewBox="0 0 24 24" class="ico"><path d="M12 8.6a3.4 3.4 0 1 0 0 6.8 3.4 3.4 0 0 0 0-6.8Z"/><path d="M19.4 13.5a7.6 7.6 0 0 0 0-3l1.7-1.3-1.8-3.1-2 .8a7.6 7.6 0 0 0-2.6-1.5L14.4 3H9.6l-.3 2.4a7.6 7.6 0 0 0-2.6 1.5l-2-.8-1.8 3.1 1.7 1.3a7.6 7.6 0 0 0 0 3l-1.7 1.3 1.8 3.1 2-.8a7.6 7.6 0 0 0 2.6 1.5l.3 2.4h4.8l.3-2.4a7.6 7.6 0 0 0 2.6-1.5l2 .8 1.8-3.1-1.7-1.3Z"/></svg>
    </button>

    <div class="level-pill">
      <div class="lp-main" id="lvText">第 1 局</div>
      <div class="lp-sub" id="lvDiff">简单</div>
    </div>

    <button class="round-btn" id="btnRestart" aria-label="重开本局">
      <svg viewBox="0 0 24 24" class="ico"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v4.6h-4.6"/></svg>
    </button>
  </header>

  <!-- 牌桌 -->
  <main class="stage">
    <div class="board-wrap" id="boardWrap">
      <div class="board" id="board"></div>
    </div>
  </main>

  <!-- 猫窝 + 道具 -->
  <footer class="dock">
    <div class="nest">
      <div class="nest-inner" id="slots"></div>
    </div>

    <div class="tools">
      <button class="tool" id="toolOut">
        <span class="tool-ico">
          <svg viewBox="0 0 24 24"><path d="M12 15V4"/><path d="M8 8l4-4 4 4"/><path d="M4 15v3.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V15"/></svg>
        </span>
        <span class="tool-txt">移出</span>
        <span class="tool-badge" id="badgeOut">1</span>
      </button>

      <button class="tool" id="toolUndo">
        <span class="tool-ico">
          <svg viewBox="0 0 24 24"><path d="M9 7H15a5 5 0 0 1 0 10H8"/><path d="M12 4 9 7l3 3"/></svg>
        </span>
        <span class="tool-txt">撤回</span>
        <span class="tool-badge" id="badgeUndo">1</span>
      </button>

      <button class="tool" id="toolShuffle">
        <span class="tool-ico">
          <svg viewBox="0 0 24 24"><path d="M4 7h4l8 10h4"/><path d="M4 17h4l3-3.7"/><path d="M14.5 8.5 16 7h4"/><path d="m17.5 4.5 2.5 2.5-2.5 2.5"/><path d="m17.5 14.5 2.5 2.5-2.5 2.5"/></svg>
        </span>
        <span class="tool-txt">洗牌</span>
        <span class="tool-badge" id="badgeShuffle">1</span>
      </button>
    </div>
  </footer>
</div>

<div class="fx" id="fx"></div>
<div class="modal-root" id="modals"></div>
<div class="toast" id="toast"></div>

<script src="js/config.js"></script>
<script src="js/idioms.js"></script>
<script src="js/idiom-dict.js"></script>
<script src="js/engine.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
